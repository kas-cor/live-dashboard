services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dashboard
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/log:/host/log:ro
      - ${TODO_HOST_PATH}:/host/todo:ro
      - /run/tailscale:/var/run/tailscale:ro
      - ${HOME}/.ssh:/root/.ssh:ro
      - /projects/dashboard/data:/ollama-data:ro
      - ${HOME}/.parsec:/root/.parsec:ro
      - ${HOME}/.hermes/data:/hermes-data:ro
      - dashboard-data:/data
    environment:
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - BACKEND_HOST=127.0.0.1
      - BACKEND_HOSTNAME=hermes
      # Let the host choose its active source address for SSH connections.
      - SSH_BIND_ADDRESS=
      - PROMO_DB_PATH=/hermes-data/promotions.db
      - PARSEC_SAVINGS_BIN=/root/.parsec/bin/parsec
    cap_add:
      - SYS_PTRACE

volumes:
  dashboard-data:
    external: true
    name: dashboard-data
